name: Weekly whitespace category tracker

on:
  schedule:
    - cron: "0 6 * * 1"     # every Monday, 6am UTC (~11:30am IST)
  push:
    paths:
      - "watchlist.txt"      # also runs the moment you add a new category
  workflow_dispatch: {}      # manual "Run workflow" button in the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pytrends openpyxl

      - name: Collect Google Trends metrics
        run: python collect_trends.py

      - name: Build dashboard
        run: python build_dashboard.py

      - name: Build Excel workbook
        run: python export_workbook.py

      - name: Commit updated data + dashboard
        run: |
          git config user.name "whitespace-tracker-bot"
          git config user.email "actions@github.com"
          git add data/ docs/
          git diff --quiet --cached || git commit -m "Weekly data update"
          git push

      - name: Deploy dashboard to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Email weekly results
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Whitespace tracker - weekly update"
          to: ${{ secrets.MAIL_USERNAME }}
          from: Whitespace Tracker
          body: |
            This week's dashboard is live: https://kshitiz171222.github.io/Automated-tracker/

            The updated Excel workbook is attached.
          attachments: docs/dashboard.xlsx

  deploy:
    needs: track
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
